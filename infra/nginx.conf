server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;

    location /internal/ { return 404; }
    location /finance-docs/internal/ { return 404; }

    location /finance-docs/ {
        set $finance_upstream http://finance:8082;
        rewrite ^/finance-docs(/.*)$ $1 break;
        proxy_pass $finance_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /finance-docs;
    }

    location = /swagger-ui.html {
        set $identity_upstream http://identity:8081;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        set $identity_upstream http://identity:8081;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        set $identity_upstream http://identity:8081;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
    }

    location /api/identity/ {
        set $identity_upstream http://identity:8081;
        proxy_pass $identity_upstream;
        proxy_set_header Host $host;
    }

    location /api/finance/ {
        set $finance_upstream http://finance:8082;
        proxy_pass $finance_upstream;
        proxy_set_header Host $host;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
    }
}
