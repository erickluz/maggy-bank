server:
  port: 8082
  forward-headers-strategy: framework
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maggy_finance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
maggy:
  internal-key: ${INTERNAL_API_KEY:local-internal-key-change-before-deployment}
