server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maggy_identity}
    username: ${DB_USER:maggy_identity}
    password: ${DB_PASSWORD:maggy_identity}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
maggy:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-before-deployment-32-bytes}
  internal-key: ${INTERNAL_API_KEY:local-internal-key-change-before-deployment}
  finance-url: ${FINANCE_URL:http://localhost:8082}
