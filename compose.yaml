services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: maggy_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-admin-password}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maggy_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  finance:
    build: ./finance-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maggy_finance
      DB_USER: maggy_finance
      DB_PASSWORD: local-finance-password
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment-32-bytes}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key-change-before-deployment}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20

  identity:
    build: ./identity-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maggy_identity
      DB_USER: maggy_identity
      DB_PASSWORD: local-identity-password
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment-32-bytes}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key-change-before-deployment}
      FINANCE_URL: http://finance:8082
    depends_on:
      postgres:
        condition: service_healthy
      finance:
        condition: service_healthy

  web:
    build: ./web
    depends_on:
      - identity
      - finance

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - identity
      - finance

volumes:
  postgres_data:
